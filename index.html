<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bobtop · AI filmpjes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: black;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: black;
        }

        /* Header met zoekbalk */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            height: 60px;
        }

        .search-bar {
            width: 100%;
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 12px 15px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-bar::placeholder {
            color: #999;
        }

        /* FEED */
        .feed {
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: black;
            scroll-snap-type: y mandatory;
        }

        /* Scrollbar styling */
        .feed::-webkit-scrollbar {
            width: 4px;
            background: transparent;
        }
        
        .feed::-webkit-scrollbar-thumb {
            background: #ff3b5c;
            border-radius: 2px;
        }

        .feed-item {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: black;
        }

        /* Media container */
        .media-container {
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .media-container video,
        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Profielfoto rechtsboven */
        .profile-image {
            position: fixed;
            top: 70px;
            right: 15px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #ff3b5c;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: #333;
            z-index: 1001;
            display: none;
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Video informatie overlay - dynamische grootte */
        .video-info {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 80px; /* Ruimte voor profielfoto */
            color: white;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 80%;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .channel-thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            overflow: hidden;
            background: #333;
            flex-shrink: 0;
        }

        .channel-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .channel-name {
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Titels en beschrijving - passen zich aan aan inhoud */
        .title-box {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            padding: 8px 12px;
            display: inline-block; /* Past zich aan aan tekst */
            max-width: 100%;
            width: fit-content;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-title {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.3;
            color: white;
        }

        .video-description {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 4px;
            color: #eee;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 3000;
            transition: transform 0.3s ease;
            border: 1px solid #ff3b5c;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Loading indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 2000;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header met zoekbalk -->
        <div class="header">
            <input type="text" class="search-bar" id="searchInput" placeholder="🔍 Zoek naar videos...">
        </div>

        <!-- Profielfoto rechtsboven -->
        <div class="profile-image" id="profileImage">
            <img src="" alt="Profile" id="profileImg">
        </div>

        <!-- Loading indicator -->
        <div id="loading" class="loading">📁 Videos laden uit videoinfo.txt...</div>

        <!-- FEED -->
        <div id="feed" class="feed"></div>

        <!-- Toast -->
        <div id="toast" class="toast">✅</div>
    </div>

    <script>
        let videoDatabase = [];
        let allVideos = [];
        let currentChannelId = null;

        // Toast melding
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Parse bestandsnaam naar titel en artiest
        function parseFilename(filename) {
            // Verwijder pad en extensie
            const name = filename.split('/').pop().split('\\').pop(); // Haal laatste deel na slash
            const withoutExt = name.replace(/\.[^/.]+$/, ""); // Verwijder extensie
            
            // Splits op eerste min
            const firstMinIndex = withoutExt.indexOf('-');
            if (firstMinIndex === -1) {
                // Geen min gevonden, gebruik hele naam als titel
                return {
                    artist: 'Onbekend',
                    title: withoutExt.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())
                };
            }
            
            // Artiest is eerste deel (in hoofdletters)
            let artist = withoutExt.substring(0, firstMinIndex);
            // Titel is de rest, vervang minnen door spaties
            let title = withoutExt.substring(firstMinIndex + 1).replace(/-/g, ' ');
            
            // Formatteer titel: eerste letter van elk woord hoofdletter
            title = title.replace(/\b\w/g, l => l.toUpperCase());
            
            return {
                artist: artist,
                title: title
            };
        }

        // Update profielfoto
        function updateProfilePicture(channelId) {
            const profileDiv = document.getElementById('profileImage');
            const profileImg = document.getElementById('profileImg');
            
            // ChannelId naar hoofdletters voor bestandsnaam
            const upperChannelId = channelId.toUpperCase();
            profileImg.src = `${upperChannelId}.png`;
            
            // Fallback als afbeelding niet bestaat
            profileImg.onerror = () => {
                profileImg.src = `https://via.placeholder.com/50/333/fff?text=${channelId[0].toUpperCase()}`;
            };
            
            profileDiv.style.display = 'block';
            currentChannelId = channelId;
        }

        // Laad videoinfo.txt
        async function loadVideoInfo() {
            try {
                const response = await fetch('videoinfo.txt');
                if (!response.ok) throw new Error('videoinfo.txt niet gevonden');
                
                const text = await response.text();
                console.log('📁 videoinfo.txt geladen');
                
                const lines = text.split('\n');
                const videos = [];
                
                lines.forEach((line, index) => {
                    line = line.trim();
                    if (line && !line.startsWith('#')) {
                        const parts = line.split('|');
                        if (parts.length >= 1) {
                            const url = parts[0].trim();
                            const parsed = parseFilename(url);
                            
                            // Gebruik gegevens uit bestand of parse
                            const channel = parts[1] ? parts[1].trim() : parsed.artist;
                            const channelId = parts[2] ? parts[2].trim() : parsed.artist.toLowerCase();
                            const title = parts[3] ? parts[3].trim() : parsed.title;
                            const description = parts[4] ? parts[4].trim() : '';
                            
                            videos.push({
                                id: index + 1,
                                type: 'video',
                                url: url,
                                channel: channel,
                                channelId: channelId,
                                title: title,
                                description: description,
                                artistUpper: parsed.artist // Voor profielfoto
                            });
                        }
                    }
                });
                
                if (videos.length > 0) {
                    videoDatabase = videos;
                    allVideos = [...videos];
                    console.log(`✅ ${videos.length} videos geladen`);
                } else {
                    throw new Error('Geen videos gevonden');
                }
            } catch (error) {
                console.warn('⚠️ Kon videoinfo.txt niet laden:', error);
                // Fallback videos
                videoDatabase = [
                    {
                        id: 1,
                        type: 'video',
                        url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                        channel: 'CleanGirl',
                        channelId: 'cleangirl',
                        title: 'Cleaning MacDonalds bathroom',
                        description: 'Today i am going to clean',
                        artistUpper: 'CLEANGIRL'
                    }
                ];
                allVideos = [...videoDatabase];
            }
            
            // Verwijder loading indicator
            document.getElementById('loading').style.display = 'none';
            
            // Laad feed
            initFeed();
        }

        // Video setup met autoplay
        function setupVideo(videoElement, channelId) {
            videoElement.loop = true;
            videoElement.playsInline = true;
            videoElement.muted = true;
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // Update profielfoto bij deze video
                        updateProfilePicture(channelId);
                        
                        // Pauzeer andere videos
                        document.querySelectorAll('.feed-item video').forEach(v => {
                            if (v !== videoElement) v.pause();
                        });
                        
                        // Speel deze af
                        videoElement.play().catch(e => console.log('Play error:', e));
                    } else {
                        videoElement.pause();
                    }
                });
            }, { threshold: 0.7 });
            
            observer.observe(videoElement);
            return observer;
        }

        // Feed item aanmaken
        function createFeedItem(mediaItem) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'feed-item';
            itemDiv.dataset.itemId = mediaItem.id;
            itemDiv.dataset.channelId = mediaItem.channelId;

            const mediaContainer = document.createElement('div');
            mediaContainer.className = 'media-container';

            const videoEl = document.createElement('video');
            videoEl.src = mediaItem.url;
            videoEl.poster = 'https://via.placeholder.com/1080x1920/333/fff?text=BobTop';
            
            const observer = setupVideo(videoEl, mediaItem.channelId);
            itemDiv._videoObserver = observer;

            mediaContainer.appendChild(videoEl);
            itemDiv.appendChild(mediaContainer);

            // Video informatie overlay - dynamisch
            const infoDiv = document.createElement('div');
            infoDiv.className = 'video-info';
            
            // Channel info met thumbnail
            const channelInfo = document.createElement('div');
            channelInfo.className = 'channel-info';
            
            const thumbDiv = document.createElement('div');
            thumbDiv.className = 'channel-thumb';
            const thumbImg = document.createElement('img');
            
            // Probeer profielfoto te laden (hoofdletters)
            const upperChannelId = mediaItem.channelId.toUpperCase();
            thumbImg.src = `${upperChannelId}.png`;
            thumbImg.onerror = () => {
                thumbImg.src = `https://via.placeholder.com/40/333/fff?text=${mediaItem.channelId[0].toUpperCase()}`;
            };
            
            thumbDiv.appendChild(thumbImg);
            channelInfo.appendChild(thumbDiv);
            
            const channelName = document.createElement('span');
            channelName.className = 'channel-name';
            channelName.textContent = mediaItem.channel;
            channelInfo.appendChild(channelName);
            
            infoDiv.appendChild(channelInfo);
            
            // Titel box - past zich aan aan tekst
            const titleBox = document.createElement('div');
            titleBox.className = 'title-box';
            
            const titleEl = document.createElement('div');
            titleEl.className = 'video-title';
            titleEl.textContent = mediaItem.title;
            titleBox.appendChild(titleEl);
            
            if (mediaItem.description) {
                const descEl = document.createElement('div');
                descEl.className = 'video-description';
                descEl.textContent = mediaItem.description;
                titleBox.appendChild(descEl);
            }
            
            infoDiv.appendChild(titleBox);
            itemDiv.appendChild(infoDiv);

            return itemDiv;
        }

        // Feed initialiseren
        function initFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            
            videoDatabase.forEach(video => {
                feed.appendChild(createFeedItem(video));
            });
            
            console.log('🎬 Feed geladen met', document.querySelectorAll('.feed-item').length, 'videos');
            
            // Start eerste video
            setTimeout(() => {
                const firstVideo = document.querySelector('.feed-item video');
                if (firstVideo) {
                    firstVideo.play().catch(e => console.log('Eerste video play error:', e));
                }
            }, 500);
            
            showToast(`🎬 ${videoDatabase.length} videos geladen`);
        }

        // Zoekfunctionaliteit
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const query = e.target.value.toLowerCase().trim();
                    
                    if (query === '') {
                        const feed = document.getElementById('feed');
                        feed.innerHTML = '';
                        allVideos.forEach(video => {
                            feed.appendChild(createFeedItem(video));
                        });
                        showToast(`🎬 Alle ${allVideos.length} videos`);
                        return;
                    }
                    
                    const matches = allVideos.filter(v => 
                        v.title.toLowerCase().includes(query) || 
                        v.channel.toLowerCase().includes(query) ||
                        v.channelId.toLowerCase().includes(query)
                    );
                    
                    if (matches.length > 0) {
                        const feed = document.getElementById('feed');
                        feed.innerHTML = '';
                        matches.forEach(video => {
                            feed.appendChild(createFeedItem(video));
                        });
                        showToast(`🔍 ${matches.length} resultaten`);
                    } else {
                        showToast('❌ Geen resultaten');
                    }
                }
            });
            
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    const feed = document.getElementById('feed');
                    feed.innerHTML = '';
                    allVideos.forEach(video => {
                        feed.appendChild(createFeedItem(video));
                    });
                    showToast(`🎬 Alle ${allVideos.length} videos`);
                }
            });
        }

        // Klik op profielfoto toont alleen videos van dat kanaal
        document.getElementById('profileImage').addEventListener('click', () => {
            if (currentChannelId) {
                const channelVideos = allVideos.filter(v => v.channelId === currentChannelId);
                if (channelVideos.length > 0) {
                    const feed = document.getElementById('feed');
                    feed.innerHTML = '';
                    channelVideos.forEach(video => {
                        feed.appendChild(createFeedItem(video));
                    });
                    showToast(`📺 ${channelVideos.length} videos van @${currentChannelId}`);
                }
            }
        });

        // Start
        loadVideoInfo();
        setupSearch();
    </script>
</body>
</html>
