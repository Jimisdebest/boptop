<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bobtop · AI filmpjes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: black;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: black;
        }

        /* Header met zoekbalk */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            height: 60px;
        }

        .search-bar {
            width: 100%;
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 12px 15px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-bar::placeholder {
            color: #999;
        }

        /* FEED */
        .feed {
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: black;
            scroll-snap-type: y mandatory;
        }

        /* Scrollbar styling */
        .feed::-webkit-scrollbar {
            width: 4px;
            background: transparent;
        }
        
        .feed::-webkit-scrollbar-thumb {
            background: #ff3b5c;
            border-radius: 2px;
        }

        .feed-item {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: black;
        }

        /* Media container */
        .media-container {
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .media-container video,
        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Video informatie overlay */
        .video-info {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            color: white;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .channel-name {
            display: inline-block;
            background: rgba(255, 59, 92, 0.9);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .video-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        .video-description {
            font-size: 14px;
            opacity: 0.9;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 3000;
            transition: transform 0.3s ease;
            border: 1px solid #ff3b5c;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Loading indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 2000;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header met zoekbalk -->
        <div class="header">
            <input type="text" class="search-bar" id="searchInput" placeholder="🔍 Zoek naar videos...">
        </div>

        <!-- Loading indicator -->
        <div id="loading" class="loading">📁 Videos laden uit videoinfo.txt...</div>

        <!-- FEED -->
        <div id="feed" class="feed"></div>

        <!-- Toast -->
        <div id="toast" class="toast">✅</div>
    </div>

    <script>
        // Fallback video database voor als videoinfo.txt niet bestaat
        const FALLBACK_VIDEOS = [
            {
                id: 1,
                type: 'video',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                channel: 'CleanGirlOfficial',
                channelId: 'cleangirl',
                title: 'Cleaning MacDonalds bathroom',
                description: 'Today i am going to clean MacDonalds bathroom for free!'
            },
            {
                id: 2,
                type: 'video',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
                channel: 'HEMA',
                channelId: 'hema',
                title: 'HEMA Regenboogrookworst',
                description: 'Koop nu HEMA regenboogrookworst!'
            }
        ];

        let videoDatabase = [];
        let allVideos = []; // Voor zoekfunctionaliteit

        // Toast melding
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Laad videoinfo.txt
        async function loadVideoInfo() {
            try {
                const response = await fetch('videoinfo.txt');
                if (!response.ok) throw new Error('videoinfo.txt niet gevonden');
                
                const text = await response.text();
                console.log('📁 videoinfo.txt geladen:', text.substring(0, 200) + '...');
                
                // Parse het tekstbestand
                const lines = text.split('\n');
                const videos = [];
                
                lines.forEach((line, index) => {
                    line = line.trim();
                    if (line && !line.startsWith('#')) { // Skip lege regels en comments
                        // Verwacht formaat: url|channel|channelId|title|description
                        const parts = line.split('|');
                        if (parts.length >= 5) {
                            videos.push({
                                id: index + 1,
                                type: 'video',
                                url: parts[0].trim(),
                                channel: parts[1].trim(),
                                channelId: parts[2].trim(),
                                title: parts[3].trim(),
                                description: parts[4].trim()
                            });
                        }
                    }
                });
                
                if (videos.length > 0) {
                    videoDatabase = videos;
                    allVideos = [...videos];
                    console.log(`✅ ${videos.length} videos geladen uit videoinfo.txt`);
                } else {
                    throw new Error('Geen videos gevonden in bestand');
                }
            } catch (error) {
                console.warn('⚠️ Kon videoinfo.txt niet laden, gebruik fallback videos:', error);
                videoDatabase = FALLBACK_VIDEOS;
                allVideos = [...FALLBACK_VIDEOS];
            }
            
            // Verwijder loading indicator
            document.getElementById('loading').style.display = 'none';
            
            // Laad feed
            initFeed();
        }

        // Video setup met autoplay
        function setupVideo(videoElement) {
            videoElement.loop = true;
            videoElement.playsInline = true;
            videoElement.muted = true; // Muted voor autoplay
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // Pauzeer andere videos
                        document.querySelectorAll('.feed-item video').forEach(v => {
                            if (v !== videoElement) v.pause();
                        });
                        
                        // Speel deze af
                        videoElement.play().catch(e => console.log('Play error:', e));
                    } else {
                        videoElement.pause();
                    }
                });
            }, { threshold: 0.7 });
            
            observer.observe(videoElement);
            return observer;
        }

        // Feed item aanmaken
        function createFeedItem(mediaItem) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'feed-item';
            itemDiv.dataset.itemId = mediaItem.id;

            const mediaContainer = document.createElement('div');
            mediaContainer.className = 'media-container';

            const videoEl = document.createElement('video');
            videoEl.src = mediaItem.url;
            videoEl.poster = 'https://via.placeholder.com/1080x1920/333/fff?text=BobTop';
            
            const observer = setupVideo(videoEl);
            itemDiv._videoObserver = observer;

            mediaContainer.appendChild(videoEl);
            itemDiv.appendChild(mediaContainer);

            // Video informatie overlay
            const infoDiv = document.createElement('div');
            infoDiv.className = 'video-info';
            infoDiv.innerHTML = `
                <div class="channel-name">@${mediaItem.channelId}</div>
                <div class="video-title">${mediaItem.title}</div>
                <div class="video-description">${mediaItem.description}</div>
            `;
            itemDiv.appendChild(infoDiv);

            return itemDiv;
        }

        // Feed initialiseren
        function initFeed() {
            const feed = document.getElementById('feed');
            
            // Leeg de feed
            feed.innerHTML = '';
            
            // Voeg alle videos toe
            videoDatabase.forEach(video => {
                feed.appendChild(createFeedItem(video));
            });
            
            console.log('🎬 Feed geladen met', document.querySelectorAll('.feed-item').length, 'videos');
            
            // Check of scrollen mogelijk is
            if (feed.scrollHeight > feed.clientHeight) {
                console.log('✅ Scrollen mogelijk!');
            } else {
                console.log('⚠️ Weinig videos, scrollen beperkt');
            }
            
            // Start eerste video
            setTimeout(() => {
                const firstVideo = document.querySelector('.feed-item video');
                if (firstVideo) {
                    firstVideo.play().catch(e => console.log('Eerste video play error:', e));
                }
            }, 500);
            
            showToast(`🎬 ${videoDatabase.length} videos geladen`);
        }

        // Zoekfunctionaliteit
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const query = e.target.value.toLowerCase().trim();
                    
                    if (query === '') {
                        // Toon alle videos
                        const feed = document.getElementById('feed');
                        feed.innerHTML = '';
                        allVideos.forEach(video => {
                            feed.appendChild(createFeedItem(video));
                        });
                        showToast(`🎬 Alle ${allVideos.length} videos`);
                        return;
                    }
                    
                    // Zoek in videos
                    const matches = allVideos.filter(v => 
                        v.title.toLowerCase().includes(query) || 
                        v.channelId.toLowerCase().includes(query) ||
                        v.description.toLowerCase().includes(query)
                    );
                    
                    if (matches.length > 0) {
                        const feed = document.getElementById('feed');
                        feed.innerHTML = '';
                        matches.forEach(video => {
                            feed.appendChild(createFeedItem(video));
                        });
                        showToast(`🔍 ${matches.length} resultaten`);
                    } else {
                        showToast('❌ Geen resultaten');
                    }
                }
            });
            
            // Clear zoekopdracht met Escape
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    const feed = document.getElementById('feed');
                    feed.innerHTML = '';
                    allVideos.forEach(video => {
                        feed.appendChild(createFeedItem(video));
                    });
                    showToast(`🎬 Alle ${allVideos.length} videos`);
                }
            });
        }

        // Start
        loadVideoInfo();
        setupSearch();
    </script>
</body>
</html>
